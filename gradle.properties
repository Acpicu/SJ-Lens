# ── 版本号：规格第十九章门禁要求 CI 打 tag 时与本文件比对，不一致即构建失败 ──
# versionName 语义化 x.y.z；versionCode 为 YYMMDDnn（当日第 nn 次构建）
VERSION_NAME=3.9.1
VERSION_CODE=26101937

# ── Gradle / JVM ──
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ── AndroidX ──
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── 非 ASCII 路径 ──
# AGP 默认拒绝在含中文的路径下构建（本工程位于 D:\桌面\SJ Lens）。
# 这里显式关闭该检查。若后续出现难以定位的构建异常，
# 第一优先排查项就是把工程整体移到纯英文路径（例如 D:\SJFollowClip）。
android.overridePathCheck=true

# ── Kotlin ──
kotlin.code.style=official
